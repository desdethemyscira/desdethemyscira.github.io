<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.data.settings.title }}{% endif %}</title>

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="{%if page.description%}{{page.description}}{%else%}{{site.data.settings.description}}{%endif%}">

  {% if site.author %}
  <meta name="author" content="{{ . }}">
  {% endif %}

  {% if page.congreso_2026 %}
  <meta property="og:locale" content="es_MX">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="Desde Themyscira">
  <meta property="og:title" content="{{ page.share_title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:image" content="{{ page.share_image | escape }}">
  <meta property="og:image:alt" content="Primer Congreso Internacional Desde Themyscira, del 9 al 13 de noviembre de 2026">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.share_title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ page.share_image | escape }}">
  {% endif %}

  <!-- ** Plugins Needed for the Project ** -->
  {% for css in site.data.plugins.css %}
  <link rel="stylesheet" href="{{ css | relative_url }}">
  {% endfor %}

  <!-- Main Stylesheet -->
  <link href="{{ '/assets/scss/style.css' | relative_url }}" rel="stylesheet">

  <!--Favicon-->
  <link rel="shortcut icon" href="{{ '/assets/images/logo_a.png' | relative_url }} " type="image/x-icon">
  <link rel="icon" href="{{ '/assets/images/logo_a.png' | relative_url }} " type="image/x-icon">

  <!-- google analytics -->
  {% if site.data.settings.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}

</head>
